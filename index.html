<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Presensi Suji - Anti Reset</title>
    <style>
        :root {
            --ios-blue: #007AFF;
            --bg-gradient: linear-gradient(180deg, #A8E6FF 0%, #FFFFFF 40%, #F2F5F9 100%);
            --quote-bg: #E1F5FE; 
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { margin: 0; background: var(--bg-gradient); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .iphone-screen { width: 100%; max-width: none; position: relative; padding-bottom: 120px; min-height: 100vh; }

        /* Card */
        .header { padding: 43px 25px 20px; display: flex; justify-content: space-between; align-items: center; }

        .avatar { width: 54px; height: 54px; flex: 0 0 54px; border-radius: 50%; border: 2px solid #fff; background: #e7f5ff; display: block; overflow: hidden; box-shadow: 0 3px 10px rgba(0,80,130,.12); }
        .avatar img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 42%; }

        .card { background: white; margin: 0 20px 20px; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .presensi-info { display: flex; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 12px; }
        .presensi-item { flex: 1; }
        .presensi-item strong { font-size: 22px; color: #1c1c1e; }
        .active-timer { color: var(--ios-blue) !important; }

        .location-box { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 10px 14px; border-radius: 12px; font-size: 12px; color: #666; }
        .location-box svg { width: 14px; height: 14px; fill: var(--ios-blue); flex: 0 0 auto; }
        .location-details { min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
        .location-details a { color: var(--ios-blue); text-decoration: none; font-weight: 600; margin-left: 4px; }

        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 20px; }
        .menu-item { text-align: center; font-size: 11px; font-weight: 700; color: #555; }
        .icon-box { aspect-ratio: 1/1; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .icon-box svg { width: 24px; height: 24px; fill: white; }

        .quote-card { margin: 30px 20px; background: var(--quote-bg); padding: 25px; border-radius: 26px; color: #263238; font-style: italic; font-size: 16px; font-weight: 700; text-align: center; border: 2px solid #81D4FA; min-height: 110px; display: flex; align-items: center; justify-content: center; }

        /* Nav Bawah */
        .bottom-container { position: fixed; bottom: 0; left: 0; width: 100%; max-width: none; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-top: 1px solid #eee; z-index: 1002; }
        .nav-bar { display: flex; justify-content: space-around; align-items: center; padding: 10px 0 25px; }
        .nav-item { text-align: center; font-size: 10px; color: #8E8E93; text-decoration: none; font-weight: 600; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--ios-blue); }
        .nav-item svg { width: 24px; height: 24px; display: block; margin: 0 auto 4px; fill: currentColor; }
        .camera-btn { width: 54px; height: 54px; background: #edf6fc; color: #3989bd; border-radius: 18px; margin-top: -35px; display: flex; align-items: center; justify-content: center; border: 3px solid white; box-shadow: 0 2px 8px rgba(35,90,125,0.12); cursor: pointer; }
        .copyright { font-size: 10px; color: #bbb; text-align: center; padding-bottom: 10px; margin-top: -10px; }
    </style>
</head>

<script>
    // State: 0=Datang Jalan, 1=Datang Stop, 2=Pulang Jalan
    let state = parseInt(localStorage.getItem('suji_state')) || 0;
    let lockedArrival = localStorage.getItem('suji_arrival') || "";
    let lockedDeparture = localStorage.getItem('suji_departure') || "";

    function updateTick() {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ":" + 
                        now.getMinutes().toString().padStart(2,'0') + ":" + 
                        now.getSeconds().toString().padStart(2,'0');
        
        const arrEl = document.getElementById('time-arrival');
        const depEl = document.getElementById('time-departure');

        if (state === 0) {
            arrEl.innerText = timeStr;
            arrEl.className = "active-timer";
            depEl.innerText = "--:--:--";
            depEl.className = "";
        } else if (state === 1) {
            arrEl.innerText = lockedArrival;
            arrEl.className = "";
            depEl.innerText = "--:--:--";
            depEl.className = "";
        } else if (state === 2) {
            arrEl.innerText = lockedArrival;
            arrEl.className = "";
            depEl.innerText = timeStr;
            depEl.className = "active-timer";
        }
    }

    // Tombol Kamera (UTAMA)
    document.getElementById('main-btn').onclick = function() {
        const nowStr = document.getElementById('top-time').innerText + ":" + new Date().getSeconds().toString().padStart(2,'0');
        
        if (state === 0) {
            state = 1;
            lockedArrival = nowStr;
            localStorage.setItem('suji_state', 1);
            localStorage.setItem('suji_arrival', lockedArrival);
            alert("Datang Terkunci!");
        } else if (state === 1) {
            state = 2;
            localStorage.setItem('suji_state', 2);
            alert("Pulang Dimulai!");
        }
    };

    // Tombol Beranda (RESET)
    document.getElementById('reset-btn').onclick = function() {
        if(confirm("Bos yakin mau RESET semua jam?")) {
            localStorage.clear();
            state = 0;
            lockedArrival = "";
            location.reload();
        }
    };


    // Lokasi GPS realtime melalui Geolocation API browser.
    // Browser harus memberi izin lokasi dan halaman dibuka melalui HTTPS atau localhost.
    let gpsWatchId = null;

    function startLiveGPS() {
        const locationEl = document.getElementById('txt-lokasi');

        if (!('geolocation' in navigator)) {
            locationEl.textContent = 'Browser ini tidak mendukung GPS/lokasi.';
            return;
        }

        locationEl.textContent = 'Meminta izin akses lokasi...';

        gpsWatchId = navigator.geolocation.watchPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = Math.round(position.coords.accuracy);
                const updatedAt = new Date(position.timestamp).toLocaleTimeString('id-ID');

                locationEl.innerHTML =
                    'Lokasi aktif • ' + lat.toFixed(6) + ', ' + lon.toFixed(6) +
                    ' • Akurasi ±' + accuracy + ' m • ' + updatedAt +
                    ' <a href="https://www.google.com/maps?q=' + lat + ',' + lon +
                    '" target="_blank" rel="noopener">Lihat peta</a>';
            },
            function(error) {
                let message = 'Lokasi GPS tidak dapat diakses.';
                if (error.code === error.PERMISSION_DENIED) {
                    message = 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser.';
                } else if (error.code === error.POSITION_UNAVAILABLE) {
                    message = 'Posisi belum tersedia. Aktifkan layanan lokasi/GPS dan coba di area terbuka.';
                } else if (error.code === error.TIMEOUT) {
                    message = 'Waktu mencari lokasi habis. Sedang mencoba kembali...';
                }
                locationEl.textContent = message;
            },
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 20000
            }
        );
    }

    // Memulai pembaruan posisi saat halaman dibuka.
    window.addEventListener('load', startLiveGPS);

        setInterval(updateTick, 1000);
    window.onload = () => {
        updateTick();
        document.getElementById('quote-display').innerText = '"Berkaca pada diri sendiri dan tidak ragu untuk berkata maaf"';
    };
</script>
